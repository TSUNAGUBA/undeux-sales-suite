name: deploy-all

# フロントエンド（Firebase Hosting）とバックエンドAPI（AWS EC2）を一括でデプロイする。
# 実行方法: GitHub の Actions タブ → "deploy-all" → "Run workflow"
#
# 実行順序はバックエンド → フロントエンドの直列。
# 理由: フロントが参照する新しい API エンドポイントが先に存在しないと、
# デプロイ完了までの間、公開中のフロントが 404 を踏むため（逆順は不可）。
# バックエンドのデプロイが失敗した場合、フロントエンドのデプロイは実行されない
# （新旧の組み合わせ事故を防ぐフェイルセーフ。フロントのみ先行させたい場合は
# 単独の deploy-frontend を使用する）。
#
# 必要なシークレットは単独ワークフローと共通（secrets: inherit で引き継ぐ）。
# 詳細は infra/deploy-guide.md を参照。
on:
  workflow_dispatch:

# concurrency は本（親）ワークフローには設定しない。
# 呼び出す deploy-backend / deploy-frontend が `concurrency: group: deploy` を持つため、
# 親も同じグループを宣言すると「親がグループを保持したまま子が同グループを待つ」構図になり、
# GitHub Actions が concurrency デッドロックを検出して実行を打ち切る
# （"a deadlock was detected for concurrency group: 'deploy'"）。
# デプロイ操作（rsync --delete 等）の排他は子ワークフロー側の `deploy` グループで担保されるため、
# 親はグループを持たなくてよい（子が直列化されるため多重実行も起きない）。

# 呼び出す deploy-backend が GHCR へ push するため packages: write を付与する
# （再利用ワークフローの GITHUB_TOKEN 権限は呼び出し側の permissions で頭打ちになるため）。
permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: バックエンド（AWS EC2）
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  frontend:
    name: フロントエンド（Firebase Hosting）
    needs: backend
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
