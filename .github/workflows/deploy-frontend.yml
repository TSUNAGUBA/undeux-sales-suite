name: deploy-frontend

# フロントエンド（Nuxt SPA）を Firebase Hosting へデプロイする。
# 実行方法: GitHub の Actions タブ → "deploy-frontend" → "Run workflow"
# 必要なシークレットは infra/deploy-guide.md を参照。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存パッケージのインストール
        working-directory: frontend
        run: npm ci

      - name: 静的SPAのビルド
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE_URL: https://${{ secrets.API_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npm run generate

      - name: Firebase Hosting へデプロイ
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
