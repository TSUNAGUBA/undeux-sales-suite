name: deploy-frontend

# フロントエンド（Nuxt SPA）を Firebase Hosting へデプロイする。
# 実行方法:
#   単独実行: GitHub の Actions タブ → "deploy-frontend" → "Run workflow"
#   通常運用: "deploy"（テストゲート付きパイプライン。backend → frontend の順で本ワークフローを呼び出す）
# 必要なシークレットは infra/deploy-guide.md を参照。
on:
  workflow_dispatch:
  # deploy（テストゲート付きパイプライン）からの再利用呼び出し（secrets は inherit で受け取る）。
  workflow_call:

# デプロイ系ワークフローの同時実行を防ぐ共通グループ（deploy-backend / deploy と共有）。
# 実行中があれば後続はキャンセルせずキューイングする。
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存パッケージのインストール
        working-directory: frontend
        run: npm ci

      - name: 静的SPAのビルド
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE_URL: https://${{ secrets.API_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npm run generate

      # サービスアカウント JSON を事前検証し、"Failed to authenticate" の原因（空・不正JSON・
      # プロジェクト不一致）をログで即座に切り分けられるようにする（private_key の中身は出力しない）。
      - name: サービスアカウントの事前検証
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT シークレットが空です。サービスアカウントの JSON 全文を登録してください（deploy-guide ステップ1-4）。"
            exit 1
          fi
          sa="$RUNNER_TEMP/firebase-sa-check.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$sa"
          if ! jq -e 'has("type") and has("project_id") and has("private_key") and has("client_email")' "$sa" >/dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT が有効なサービスアカウント JSON ではありません（type/project_id/private_key/client_email が必要）。鍵JSONの全文をそのまま登録してください。"
            rm -f "$sa"; exit 1
          fi
          echo "サービスアカウント: type=$(jq -r .type "$sa") project_id=$(jq -r .project_id "$sa") client_email=$(jq -r .client_email "$sa")"
          if [ -n "${FIREBASE_PROJECT_ID:-}" ] && [ "$(jq -r .project_id "$sa")" != "$FIREBASE_PROJECT_ID" ]; then
            echo "::warning::サービスアカウントの project_id が FIREBASE_PROJECT_ID シークレットと一致していません。デプロイ先プロジェクトを確認してください。"
          fi
          rm -f "$sa"

      # Firebase Hosting（本番 live チャンネル）へデプロイする。
      # 公式アクション（FirebaseExtended/action-hosting-deploy）は「公開中と完全に同一内容の再デプロイ」を
      # 失敗として扱う（HTTP 400 FAILED_PRECONDITION: "is the current active version"）。差分ゼロの重複デプロイ
      # （deploy と deploy-frontend の連続実行等）でジョブが赤くなるのを避けるため、シェルで firebase-tools を
      # 実行し、この no-op（＝サイトは既に最新）のみ成功扱いにして冪等化する。それ以外の失敗は従来どおり失敗させる。
      # 認証はサービスアカウント JSON をファイル化し GOOGLE_APPLICATION_CREDENTIALS で渡す
      # （firebase-tools 15 系は本 env を確実に解決する。google-github-actions/auth は併用しない＝CLOUDSDK_* が
      # 認証解決を阻害しうるため）。firebase.json はリポジトリルート（hosting.public=frontend/.output/public）。
      - name: Firebase Hosting へデプロイ（本番 live チャンネル・冪等）
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -uo pipefail
          sa="$RUNNER_TEMP/firebase-sa-deploy.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$sa"
          export GOOGLE_APPLICATION_CREDENTIALS="$sa"
          set +e
          out="$(npx -y firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1)"
          code=$?
          set -e
          rm -f "$sa"
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "デプロイ成功。"
            exit 0
          fi
          # 差分ゼロ（公開中と同一版）は no-op として成功扱いにする（サイトは既に最新）。
          if printf '%s' "$out" | grep -q "is the current active version"; then
            echo "::notice::公開中の内容と同一のため、リリースはスキップされました（差分ゼロの no-op。サイトは最新です）。"
            exit 0
          fi
          echo "::error::Firebase デプロイに失敗しました。上記ログを確認してください。"
          exit "$code"
