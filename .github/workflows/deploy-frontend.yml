name: deploy-frontend

# フロントエンド（Nuxt SPA）を Firebase Hosting へデプロイする。
# 実行方法:
#   単独実行: GitHub の Actions タブ → "deploy-frontend" → "Run workflow"
#   一括実行: "deploy-all"（backend → frontend の順で本ワークフローを呼び出す）
# 必要なシークレットは infra/deploy-guide.md を参照。
on:
  workflow_dispatch:
  # deploy-all からの再利用呼び出し（secrets は inherit で受け取る）。
  workflow_call:

# デプロイ系ワークフローの同時実行を防ぐ共通グループ（deploy-backend / deploy-all と共有）。
# 実行中があれば後続はキャンセルせずキューイングする。
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存パッケージのインストール
        working-directory: frontend
        run: npm ci

      - name: 静的SPAのビルド
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE_URL: https://${{ secrets.API_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npm run generate

      # サービスアカウント JSON を事前検証し、"Failed to authenticate" の原因（空・不正JSON・
      # プロジェクト不一致）をログで即座に切り分けられるようにする（private_key の中身は出力しない）。
      - name: サービスアカウントの事前検証
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT シークレットが空です。サービスアカウントの JSON 全文を登録してください（deploy-guide ステップ1-4）。"
            exit 1
          fi
          sa="$RUNNER_TEMP/firebase-sa-check.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$sa"
          if ! jq -e 'has("type") and has("project_id") and has("private_key") and has("client_email")' "$sa" >/dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT が有効なサービスアカウント JSON ではありません（type/project_id/private_key/client_email が必要）。鍵JSONの全文をそのまま登録してください。"
            rm -f "$sa"; exit 1
          fi
          echo "サービスアカウント: type=$(jq -r .type "$sa") project_id=$(jq -r .project_id "$sa") client_email=$(jq -r .client_email "$sa")"
          if [ -n "${FIREBASE_PROJECT_ID:-}" ] && [ "$(jq -r .project_id "$sa")" != "$FIREBASE_PROJECT_ID" ]; then
            echo "::warning::サービスアカウントの project_id が FIREBASE_PROJECT_ID シークレットと一致していません。デプロイ先プロジェクトを確認してください。"
          fi
          rm -f "$sa"

      # Firebase 公式アクションで本番（live チャンネル）へデプロイする。
      # 手動の GOOGLE_APPLICATION_CREDENTIALS 方式は firebase-tools の既知不具合（CI で ADC を
      # 取りこぼし "Failed to authenticate" になる。firebase/firebase-tools#10726 等）を踏むため、
      # サービスアカウント認証を確実に扱う公式アクションに委ねる（google-github-actions/auth は併用しない。
      # 併用時に設定される CLOUDSDK_* 系の環境変数が firebase-tools の認証解決を阻害しうるため）。
      # entryPoint 既定はリポジトリルート（firebase.json があり hosting.public=frontend/.output/public）。
      # repoToken は PR プレビューコメント用途のため live デプロイでは不要（付与しない）。
      - name: Firebase Hosting へデプロイ（本番 live チャンネル）
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
