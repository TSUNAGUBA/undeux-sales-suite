server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA ルーティング: 実ファイルがなければ index.html を返す。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静的アセットは長期キャッシュ（ファイル名にハッシュを含むため）。
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
