# ============================================================
#  UndeuxSales — AWS EC2 デプロイ用 Compose 定義
#  - api        : C# Web API（Caddy 経由で公開）
#  - dataloader : 初期DBダンプを RDS へ投入（冪等。初回のみ実投入）
#  - caddy      : 自動HTTPS リバースプロキシ（Let's Encrypt）
#  データベースは AWS RDS（本ファイルには含めない）。
#  設定値は同ディレクトリの .env から読み込む（GitHub Actions が生成）。
# ============================================================
name: undeux-sales-suite

services:
  dataloader:
    build:
      context: ../../backend
      target: dataloader
    environment:
      ConnectionStrings__Default: "${UNDEUX_DB_CONNECTION}"
      UNDEUX_DUMP_PATH: /refference
      UNDEUX_SCHEMA_PATH: /app/db/schema.sql
    volumes:
      - ../../refference:/refference:ro
      - ../../db:/app/db:ro
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  api:
    build:
      context: ../../backend
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "${UNDEUX_DB_CONNECTION}"
      Firebase__ProjectId: "${UNDEUX_FIREBASE_PROJECT_ID}"
      Cors__AllowedOrigins__0: "${UNDEUX_FRONTEND_ORIGIN}"
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  caddy:
    image: caddy:2
    environment:
      UNDEUX_API_DOMAIN: "${UNDEUX_API_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

volumes:
  caddy-data:
  caddy-config:
