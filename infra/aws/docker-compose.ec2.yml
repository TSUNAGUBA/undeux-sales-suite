# ============================================================
#  UndeuxSales — AWS EC2 デプロイ用 Compose 定義
#  - api        : C# Web API
#  - dataloader : 初期DBダンプを RDS へ投入（冪等。初回のみ実投入）
#  公開（80/443・自動HTTPS）は EC2 上の既存 nginx-proxy + acme-companion に
#  委譲する。api を VIRTUAL_HOST 付きで proxy ネットワークに参加させると、
#  nginx-proxy が自動検出してリバースプロキシし、証明書も自動取得される。
#  データベースは AWS RDS（本ファイルには含めない）。
#  設定値は同ディレクトリの .env から読み込む（GitHub Actions が生成）。
# ============================================================
name: undeux-sales-suite

# コンテナログのローテート（json-file は既定で無上限に成長し、デプロイ間隔が長い運用では
# ディスク枯渇要因になる。ビルドキャッシュの自動クリーンアップ（deploy-ec2.sh）と併せて
# ディスク使用量を有界に保つ）。
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dataloader:
    logging: *bounded-logging
    # イメージは CI（deploy-backend ワークフロー）でビルドし GHCR へ push 済み。EC2 は pull のみ。
    # UNDEUX_IMAGE_REPO / UNDEUX_IMAGE_TAG は GitHub Actions が .env に書き込む。
    image: "${UNDEUX_IMAGE_REPO}-dataloader:${UNDEUX_IMAGE_TAG}"
    environment:
      ConnectionStrings__Default: "${UNDEUX_DB_CONNECTION}"
      UNDEUX_DUMP_PATH: /refference
      UNDEUX_SCHEMA_PATH: /app/db/schema.sql
    volumes:
      - ../../refference:/refference:ro
      - ../../db:/app/db:ro
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  api:
    logging: *bounded-logging
    # イメージは CI（deploy-backend ワークフロー）でビルドし GHCR へ push 済み。EC2 は pull のみ。
    image: "${UNDEUX_IMAGE_REPO}-api:${UNDEUX_IMAGE_TAG}"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "${UNDEUX_DB_CONNECTION}"
      Firebase__ProjectId: "${UNDEUX_FIREBASE_PROJECT_ID}"
      Cors__AllowedOrigins__0: "${UNDEUX_FRONTEND_ORIGIN}"
      # EC2 上の nginx-proxy / acme-companion による自動公開・HTTPS化。
      # VIRTUAL_HOST のドメインで公開され、acme-companion が証明書を取得する
      # （acme-companion 側に DEFAULT_EMAIL 設定済みのため EMAIL 指定は不要）。
      VIRTUAL_HOST: "${UNDEUX_API_DOMAIN}"
      VIRTUAL_PORT: "8080"
      VIRTUAL_PROTO: http
      LETSENCRYPT_HOST: "${UNDEUX_API_DOMAIN}"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - proxy
    # readiness（DB接続込み）で判定し、API が実際に応答可能になってから healthy とする。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

networks:
  # EC2 上の既存 nginx-proxy が参加しているネットワーク（外部管理）。
  # 本 compose では作成せず、既存のものに接続する。
  proxy:
    external: true
    name: tsunaguba-dev-001
